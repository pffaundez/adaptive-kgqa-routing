[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-kgqa-routing"
version = "0.1.0"
description = "Pre-execution routing among heterogeneous KGQA workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = []
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_kgqa_routing"]

